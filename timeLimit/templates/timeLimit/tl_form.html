<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} - TL Management Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #173f5f;
            color: white;
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header a {
            color: white;
            text-decoration: none;
            background: #ffffff22;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #173f5f;
            font-size: 24px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #173f5f;
            box-shadow: 0 0 0 2px #173f5f22;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-save {
            background: #173f5f;
            color: white;
        }

        .btn-save:hover {
            background: #0f2d45;
        }

        .btn-cancel {
            background: #e5e7eb;
            color: #333;
        }

        .error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .required {
            color: red;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .header {
                padding: 18px;
            }

            .header h1 {
                font-size: 21px;
            }

            .container {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <h1>TL Management Portal</h1>

    <a href="{% url 'tl_records' %}">
        ← TL Records
    </a>

</div>


<div class="container">

    <div class="card">

        <h2>{{ title }}</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="form-grid">

                {% for field in form %}

                    <div class="form-group
                        {% if field.name == 'description' or field.name == 'current_situation' or field.name == 'tl_pdf' or field.name == 'answer_pdf' %}
                            full
                        {% endif %}
                    ">

                        <label for="{{ field.id_for_label }}">
                            {{ field.label }}

                            {% if field.field.required %}
                                <span class="required">*</span>
                            {% endif %}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="error">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                    </div>

                {% endfor %}

            </div>


            <div class="buttons">

                <button type="submit" class="btn btn-save">
                    Save TL Record
                </button>

                <a href="{% url 'tl_records' %}" class="btn btn-cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
