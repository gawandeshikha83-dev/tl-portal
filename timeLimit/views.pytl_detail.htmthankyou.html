<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thank You - TL Management Portal</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 55px 40px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
            max-width: 550px;
            width: 100%;
        }

        h1 {
            color: #16a34a;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .btn:hover {
            opacity: 0.88;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                Thank You!
            </h1>

            <p>
                You have viewed all TL records.
            </p>

            <a
                href="{% url 'tl_records' %}"
                class="btn"
            >
                ← Back to TL Records
            </a>

        </div>

    </div>

</body>

</html>
